[workspace]
resolver = "2"
members = ["crates/neb-core", "crates/neb-storage", "crates/neb-ingest", "crates/neb-service", "crates/neb-cli", "crates/neb-app"]
default-members = ["crates/neb-core", "crates/neb-storage", "crates/neb-ingest", "crates/neb-service", "crates/neb-cli"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.90"
authors = ["timeStarry"]
license = "LicenseRef-Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
