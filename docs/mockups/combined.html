<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nebulume 合并方案</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
:root {
  --a-window: #262626;
  --a-rail: #1d1d1d;
  --a-side: #212121;
  --a-raised: #303030;
  --a-hover: #2c2c2c;
  --a-line: #3a3a3a;
  --a-stage: #1b1b1b;
  --a-text: #ececec;
  --a-text-2: #a6a6a6;
  --a-text-3: #7a7a7a;
  --a-star: #f0c050;
  --a-pick: #86cf9c;
  --a-reject: #e8786f;
  --a-series: #5b8fd9;
  --a-series-hover: #79a5e4;
  --a-ring: #f5f5f5;
  --a-ease: cubic-bezier(.2, 0, 0, 1);
  --a-font: var(--font-sans, "Anthropic Sans", -apple-system, "PingFang SC", "Helvetica Neue", sans-serif);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: transparent; }
body { font-family: var(--a-font); color: var(--a-text); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--a-ring); outline-offset: 2px; }
.window { position: relative; display: grid; grid-template-columns: 56px 248px 1fr; height: 100vh; background: var(--a-window); overflow: hidden; transition: grid-template-columns 180ms var(--a-ease); }
.window.collapsed { grid-template-columns: 56px 0 1fr; }
.rail { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0; background: var(--a-rail); }
.rail button { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--a-text-3); font-size: 20px; transition: color 120ms var(--a-ease), background 120ms var(--a-ease); }
.rail button:hover { color: var(--a-text); }
.rail button[aria-current="true"] { color: var(--a-text); background: var(--a-raised); }
.rail .mark { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--a-text); margin-bottom: 14px; display: grid; place-items: center; }
.rail .mark::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--a-text); }
.rail .spacer { flex: 1; }
.libs { overflow: hidden auto; min-width: 0; background: var(--a-side); font-size: 13px; }
.libs-inner { width: 248px; padding: 14px 10px 20px; }
.libs-head { display: flex; align-items: center; justify-content: space-between; height: 28px; margin: 0 4px 8px 8px; color: var(--a-text-3); font-size: 12px; }
.libs-head button { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; font-size: 16px; color: var(--a-text-3); }
.libs-head button:hover { color: var(--a-text); background: var(--a-raised); }
.node { position: relative; display: flex; align-items: center; gap: 6px; width: 100%; height: 30px; padding: 0 6px 0 calc(6px + var(--depth, 0) * 16px); border-radius: 6px; text-align: left; color: var(--a-text-2); }
.node:hover { background: var(--a-hover); color: var(--a-text); }
.node[aria-current="true"] { background: var(--a-raised); color: var(--a-text); }
.node .chev { width: 16px; display: grid; place-items: center; font-size: 13px; color: var(--a-text-3); transition: transform 120ms var(--a-ease); }
.node[aria-expanded="true"] .chev { transform: rotate(90deg); }
.node .chev.none { visibility: hidden; }
.node .ico { font-size: 16px; color: var(--a-text-3); }
.node .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node .n { color: var(--a-text-3); font-size: 12px; }
.node .more { width: 22px; height: 22px; display: none; place-items: center; border-radius: 5px; color: var(--a-text-2); }
.node .more:hover { background: var(--a-line); color: var(--a-text); }
.node:hover .more, .node:focus-within .more { display: grid; }
.node:hover .n, .node:focus-within .n { display: none; }
.node .offline { width: 6px; height: 6px; border-radius: 3px; background: var(--a-text-3); }
.node .online { width: 6px; height: 6px; border-radius: 3px; background: var(--a-pick); }
.libs .gap { height: 10px; }
.main { display: grid; grid-template-rows: 56px 1fr; min-width: 0; min-height: 0; }
.bar { display: flex; align-items: center; gap: 12px; padding: 0 20px; min-width: 0; }
.crumbs { display: flex; align-items: baseline; gap: 6px; min-width: 0; white-space: nowrap; }
.crumbs h1 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -0.01em; }
.crumbs .path { color: var(--a-text-3); font-size: 14px; overflow: hidden; text-overflow: ellipsis; }
.bar .grow { flex: 1; }
.views { display: flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--a-raised); }
.views button { height: 28px; padding: 0 12px; border-radius: 6px; font-size: 13px; color: var(--a-text-2); display: flex; align-items: center; gap: 6px; }
.views button i { font-size: 15px; }
.views button[aria-selected="true"] { background: var(--a-window); color: var(--a-text); }
.find { display: flex; align-items: center; gap: 8px; height: 32px; min-width: 200px; padding: 0 10px; border-radius: 8px; background: var(--a-raised); color: var(--a-text-3); font-size: 13px; }
.find kbd { margin-left: auto; font: inherit; font-size: 11px; color: var(--a-text-3); border: 1px solid var(--a-line); border-radius: 4px; padding: 0 4px; }
.icon-btn { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--a-text-2); font-size: 18px; }
.icon-btn:hover { color: var(--a-text); background: var(--a-raised); }
.body { position: relative; min-height: 0; overflow: hidden; }
.view { position: absolute; inset: 0; display: none; }
.view.on { display: grid; }
.subbar { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 20px; font-size: 13px; color: var(--a-text-2); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 6px 0 10px; border-radius: 13px; background: var(--a-raised); color: var(--a-text); font-size: 12px; }
.chip button { width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; color: var(--a-text-2); }
.chip button:hover { background: var(--a-line); color: var(--a-text); }
.toggle { height: 26px; padding: 0 10px; border-radius: 13px; color: var(--a-text-2); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
.toggle:hover { background: var(--a-raised); color: var(--a-text); }
.toggle[aria-pressed="true"] { background: var(--a-raised); color: var(--a-text); }
.photos { grid-template-rows: 40px 1fr; }
.photos-body { position: relative; display: grid; grid-template-columns: 1fr 28px; min-height: 0; }
.scroll { overflow: auto; padding: 0 8px 40px 20px; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.day { margin-bottom: 24px; }
.day-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: baseline; gap: 12px; padding: 10px 0; background: var(--a-window); }
.day-head h2 { margin: 0; font-size: 18px; font-weight: 500; }
.day-head span { color: var(--a-text-3); font-size: 13px; }
.row { display: flex; gap: 4px; margin-bottom: 4px; }
.tile { position: relative; flex: none; overflow: hidden; background: var(--a-raised); border-radius: 2px; }
.tile img { display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 200ms var(--a-ease); }
.tile img.ready { opacity: 1; }
.tile.reject::before { content: ""; position: absolute; left: 0; right: 0; top: 0; z-index: 1; height: 3px; background: var(--a-reject); }
.tile::after { content: ""; position: absolute; inset: 0; border: 2px solid transparent; border-radius: 2px; pointer-events: none; transition: border-color 120ms var(--a-ease); }
.tile.selected::after { border-color: var(--a-ring); }
.tile .meta { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: rgba(20, 20, 20, .72); font-size: 12px; opacity: 0; transform: translateY(4px); transition: opacity 120ms var(--a-ease), transform 120ms var(--a-ease); }
.tile:hover .meta, .tile:focus-visible .meta { opacity: 1; transform: none; }
.tile .meta .stars { margin-left: auto; color: var(--a-star); letter-spacing: 1px; }
.tile .badge { position: absolute; top: 8px; left: 6px; display: flex; gap: 4px; z-index: 1; }
.tile .badge i { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 14px; background: rgba(20, 20, 20, .72); }
.badge .pick, .strip-mark.pick { color: var(--a-pick); }
.badge .reject, .strip-mark.reject { color: var(--a-reject); }
.scrub { position: relative; margin: 14px 0; }
.scrub .track { position: absolute; left: 13px; top: 0; bottom: 0; width: 2px; background: var(--a-line); border-radius: 1px; }
.scrub .thumb { position: absolute; left: 9px; width: 10px; height: 34px; border-radius: 5px; background: var(--a-text-2); }
.scrub .label { position: absolute; right: 30px; transform: translateY(-50%); white-space: nowrap; font-size: 12px; color: var(--a-text-2); padding: 3px 8px; border-radius: 6px; background: var(--a-raised); opacity: 0; transition: opacity 120ms var(--a-ease); pointer-events: none; }
.scrub:hover .label { opacity: 1; }
.cull { grid-template-columns: 1fr 300px; grid-template-rows: 40px 1fr 96px; }
.cull .subbar { grid-column: 1 / -1; }
.progress-line { display: flex; align-items: center; gap: 10px; }
.progress-line .track { width: 140px; height: 4px; border-radius: 2px; background: var(--a-raised); overflow: hidden; }
.progress-line .track span { display: block; height: 100%; background: var(--a-text-2); transition: width 180ms var(--a-ease); }
.count-pick { color: var(--a-pick); display: inline-flex; gap: 4px; align-items: center; }
.count-reject { color: var(--a-reject); display: inline-flex; gap: 4px; align-items: center; }
.primary { height: 30px; padding: 0 12px; border-radius: 8px; background: var(--a-text); color: var(--a-window); font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.primary:hover { background: #ffffff; }
.loupe { position: relative; display: grid; place-items: center; min-height: 0; background: var(--a-stage); margin: 0 0 0 20px; border-radius: 4px; overflow: hidden; }
.loupe img { max-width: calc(100% - 32px); max-height: calc(100% - 32px); display: block; transition: opacity 120ms var(--a-ease); }
.loupe .state { position: absolute; left: 14px; top: 14px; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 6px; background: rgba(20, 20, 20, .8); font-size: 13px; opacity: 0; transform: translateY(-4px); transition: opacity 140ms var(--a-ease), transform 140ms var(--a-ease); }
.loupe .state.on { opacity: 1; transform: none; }
.loupe .state.pick { color: var(--a-pick); }
.loupe .state.reject { color: var(--a-reject); }
.cull-side { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; padding: 0 20px 0 16px; font-size: 13px; }
.cull-side .name { padding: 2px 0 10px; }
.cull-side .name b { display: block; font-size: 16px; font-weight: 500; }
.cull-side .name span { color: var(--a-text-3); font-size: 12px; }
.cull-side .scroll-y { overflow: auto; min-height: 0; }
.hist { position: relative; height: 72px; border-radius: 6px; background: var(--a-stage); overflow: hidden; }
.hist svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.hist .note { position: absolute; right: 6px; top: 4px; font-size: 11px; color: var(--a-text-3); }
.exposure { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0 14px; }
.exposure div { padding: 8px; border-radius: 8px; background: var(--a-raised); }
.exposure b { display: block; font-size: 15px; font-weight: 500; }
.exposure span { color: var(--a-text-3); font-size: 11px; }
.cull-side dl { display: grid; grid-template-columns: 52px 1fr; gap: 6px 10px; margin: 0; }
.cull-side dt { color: var(--a-text-3); }
.cull-side dd { margin: 0; overflow-wrap: anywhere; }
.keys { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 12px 0 0; }
.keys button { display: flex; align-items: center; justify-content: space-between; height: 34px; padding: 0 10px; border-radius: 8px; background: var(--a-raised); font-size: 13px; color: var(--a-text); }
.keys button kbd { font: inherit; font-size: 11px; color: var(--a-text-3); }
.keys button:hover { background: var(--a-line); }
.keys .k-pick[aria-pressed="true"] { color: var(--a-pick); }
.keys .k-reject[aria-pressed="true"] { color: var(--a-reject); }
.keys .stars-row { grid-column: 1 / -1; display: flex; gap: 2px; justify-content: space-between; padding: 0 2px; }
.keys .stars-row button { flex: 1; justify-content: center; background: none; color: var(--a-text-3); height: 30px; font-size: 16px; }
.keys .stars-row button.on { color: var(--a-star); }
.keys .stars-row button:hover { background: var(--a-raised); }
.cull-strip { grid-column: 1 / -1; display: flex; gap: 4px; align-items: center; padding: 0 20px; overflow-x: auto; scrollbar-width: none; }
.cull-strip::-webkit-scrollbar { display: none; }
.cull-strip button { position: relative; flex: none; height: 60px; border-radius: 2px; overflow: hidden; opacity: .5; transition: opacity 120ms var(--a-ease); }
.cull-strip button.seen { opacity: .78; }
.cull-strip button:hover { opacity: 1; }
.cull-strip button[aria-current="true"] { opacity: 1; outline: 2px solid var(--a-ring); outline-offset: 1px; }
.cull-strip img { height: 100%; display: block; }
.cull-strip .strip-mark { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; }
.cull-strip .strip-mark.pick { background: var(--a-pick); }
.cull-strip .strip-mark.reject { background: var(--a-reject); }
.cull-strip button.hidden { display: none; }
.overview { overflow: auto; display: none; }
.overview.on { display: block; }
.ov { max-width: 1120px; padding: 6px 28px 64px 20px; }
.figures { display: flex; gap: 48px; flex-wrap: wrap; padding: 6px 0 22px; border-bottom: 1px solid var(--a-line); }
.figure b { display: block; font-size: 22px; font-weight: 500; }
.figure span { font-size: 13px; color: var(--a-text-2); }
.ov section { padding: 22px 0; border-bottom: 1px solid var(--a-line); }
.ov section:last-child { border-bottom: 0; }
.ov h2 { margin: 0 0 2px; font-size: 18px; font-weight: 500; }
.ov .hint { margin: 0 0 14px; font-size: 13px; color: var(--a-text-3); }
.ov .head { display: flex; align-items: baseline; gap: 12px; }
.ov .head .act { margin-left: auto; font-size: 12px; color: var(--a-text-3); padding: 3px 8px; border-radius: 6px; }
.ov .head .act:hover { background: var(--a-raised); color: var(--a-text); }
.timeline { position: relative; }
.timeline svg { display: block; width: 100%; height: 150px; overflow: visible; }
.grid-line { stroke: var(--a-line); stroke-width: 1; }
.axis { fill: var(--a-text-3); font-size: 12px; }
.bar-mark { fill: var(--a-series); transition: fill 80ms linear; }
.hit { fill: transparent; cursor: pointer; }
.hit:hover + .bar-mark, .bar-mark.active { fill: var(--a-series-hover); }
.funnel { display: flex; height: 22px; gap: 2px; border-radius: 4px; overflow: hidden; }
.funnel button { position: relative; height: 100%; min-width: 4px; }
.funnel .f-pick { background: var(--a-pick); }
.funnel .f-reject { background: var(--a-reject); }
.funnel .f-rated { background: var(--a-series); }
.funnel .f-unseen { background: var(--a-raised); }
.funnel button:hover { filter: brightness(1.12); }
.funnel-legend { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; color: var(--a-text-2); }
.funnel-legend span { display: inline-flex; align-items: center; gap: 6px; }
.funnel-legend i.key { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.funnel-legend b { color: var(--a-text); font-weight: 500; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
.ranked { list-style: none; margin: 0; padding: 0; }
.ranked li button { display: grid; grid-template-columns: minmax(0, 1fr) 140px 48px; align-items: center; gap: 12px; width: 100%; height: 34px; padding: 0 8px; border-radius: 6px; text-align: left; font-size: 13px; color: var(--a-text-2); }
.ranked li button:hover { background: var(--a-hover); color: var(--a-text); }
.ranked .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--a-text); }
.ranked .meter { height: 6px; border-radius: 3px; background: var(--a-raised); overflow: hidden; }
.ranked .meter span { display: block; height: 100%; border-radius: 3px; background: var(--a-series); }
.ranked .num { text-align: right; }
.mini svg { display: block; width: 100%; height: 120px; overflow: visible; }
.tip { position: absolute; z-index: 5; pointer-events: none; padding: 6px 9px; border-radius: 8px; background: var(--a-text); color: var(--a-window); font-size: 12px; white-space: nowrap; opacity: 0; transform: translate(-50%, calc(-100% - 8px)); transition: opacity 80ms linear; }
.tip.on { opacity: 1; }
.tip b { font-weight: 500; }
.viewer { position: absolute; inset: 0; z-index: 10; display: grid; grid-template-rows: 56px 1fr 84px; background: var(--a-stage); visibility: hidden; opacity: 0; transition: opacity 240ms var(--a-ease), visibility 0s 240ms; }
.viewer.open { visibility: visible; opacity: 1; transition: opacity 240ms var(--a-ease); }
.vbar { display: flex; align-items: center; gap: 12px; padding: 0 16px; }
.vbar .name { font-size: 16px; font-weight: 500; }
.vbar .sub { color: var(--a-text-3); font-size: 13px; }
.vbar .grow { flex: 1; }
.stage { position: relative; overflow: hidden; }
.stage img { position: absolute; transform-origin: 0 0; user-select: none; }
.vstrip { display: flex; gap: 4px; align-items: center; padding: 0 16px; overflow-x: auto; scrollbar-width: none; }
.vstrip::-webkit-scrollbar { display: none; }
.vstrip button { flex: none; height: 56px; border-radius: 2px; overflow: hidden; opacity: .45; }
.vstrip button[aria-current="true"] { opacity: 1; outline: 2px solid var(--a-ring); outline-offset: 1px; }
.vstrip img { height: 100%; display: block; }
.sheet { position: absolute; inset: 0; z-index: 12; display: grid; grid-template-rows: auto 1fr; background: var(--a-window); visibility: hidden; opacity: 0; transform: translateY(10px); transition: opacity 180ms var(--a-ease), transform 180ms var(--a-ease), visibility 0s 180ms; }
.sheet.open { visibility: visible; opacity: 1; transform: none; transition: opacity 180ms var(--a-ease), transform 180ms var(--a-ease); }
.sheet-head { display: flex; align-items: center; gap: 12px; padding: 16px 20px; }
.sheet-head h2 { margin: 0; font-size: 18px; font-weight: 500; }
.sheet-head .grow { flex: 1; }
.sheet-cols { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
.sheet-col { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; padding: 0 20px 20px; }
.sheet-col + .sheet-col { border-left: 1px solid var(--a-line); }
.sheet-col h3 { margin: 0 0 4px; font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.sheet-col p { margin: 0 0 12px; font-size: 13px; color: var(--a-text-2); line-height: 1.6; max-width: 52ch; }
.sheet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 4px; align-content: start; overflow: auto; }
.sheet-grid img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; display: block; border-radius: 2px; background: var(--a-raised); }
.sheet-actions { display: flex; gap: 8px; padding-top: 14px; flex-wrap: wrap; align-items: center; }
.secondary { height: 30px; padding: 0 12px; border-radius: 8px; background: var(--a-raised); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.secondary:hover { background: var(--a-line); }
.danger { height: 30px; padding: 0 12px; border-radius: 8px; background: rgba(232, 120, 111, .14); color: var(--a-reject); font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.danger:hover { background: rgba(232, 120, 111, .24); }
.sheet-actions .note { flex-basis: 100%; font-size: 12px; color: var(--a-text-3); }
.menu { position: absolute; z-index: 30; min-width: 200px; padding: 4px; border-radius: 10px; background: var(--a-raised); border: 1px solid var(--a-line); font-size: 13px; display: none; }
.menu.open { display: block; }
.menu button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; border-radius: 6px; text-align: left; }
.menu button:hover { background: var(--a-line); }
.menu i { font-size: 16px; color: var(--a-text-2); }
.status { position: absolute; left: 50%; bottom: 16px; z-index: 40; display: flex; gap: 8px; align-items: center; padding: 6px 8px 6px 12px; border-radius: 8px; background: var(--a-text); color: var(--a-window); font-size: 13px; opacity: 0; transform: translate(-50%, 8px); transition: opacity 180ms var(--a-ease), transform 180ms var(--a-ease); pointer-events: none; }
.status.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.status button { padding: 2px 8px; border-radius: 6px; font-weight: 500; }
.status button:hover { background: rgba(0, 0, 0, .08); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0s !important; } }
</style>
</head>
<body>
<div class="window" id="app">
  <nav class="rail" aria-label="主导航">
    <span class="mark" aria-hidden="true"></span>
    <button aria-current="true" aria-label="图片库（⌘B 收起或展开）" id="railLibs"><i class="ti ti-photo" aria-hidden="true"></i></button>
    <button aria-label="位置"><i class="ti ti-server" aria-hidden="true"></i></button>
    <button aria-label="导入"><i class="ti ti-download" aria-hidden="true"></i></button>
    <span class="spacer"></span>
    <button aria-label="设置"><i class="ti ti-settings" aria-hidden="true"></i></button>
  </nav>

document.addEventListener('click', (e) => { if (!e.target.closest('#menu') && !e.target.closest('[data-more]')) $('menu').classList.remove('open'); });

$('chips').addEventListener('click', (e) => { const b = e.target.closest('[data-chip]'); if (b) { state.filters.splice(Number(b.dataset.chip), 1); renderPhotos(); } });
$('pHide').onclick = () => { state.hide = !state.hide; $('pHide').setAttribute('aria-pressed', state.hide); $('cHide').setAttribute('aria-pressed', state.hide); renderAll(); };
$('pZoom').onclick = () => { state.rowHeight = state.rowHeight === 200 ? 280 : state.rowHeight === 280 ? 140 : 200; renderPhotos(); };
function select(index) { tiles.get(state.selected)?.classList.remove('selected'); state.selected = index; const t = tiles.get(index); if (t) { t.classList.add('selected'); t.focus({ preventScroll: true }); t.scrollIntoView({ block: 'nearest' }); } }
function syncScrub() {

  const top = (max > 0 ? scroll.scrollTop / max : 0) * Math.max(0, scrub.clientHeight - 34); $('scrubThumb').style.top = `${top}px`;
  const days = [...scroll.querySelectorAll('.day')]; const cur = days.filter((d) => d.offsetTop <= scroll.scrollTop + 20).pop() || days[0];
  if (cur) { $('scrubLabel').textContent = dayLabel(cur.dataset.date); $('scrubLabel').style.top = `${top + 17}px`; }
}
$('scroll').addEventListener('scroll', syncScrub);
$('scrub').addEventListener('pointerdown', (event) => { const scrub = $('scrub'); const scroll = $('scroll'); const move = (e) => { const r = scrub.getBoundingClientRect(); scroll.scrollTop = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) * (scroll.scrollHeight - scroll.clientHeight); }; move(event); scrub.setPointerCapture(event.pointerId); scrub.onpointermove = move; scrub.onpointerup = () => { scrub.onpointermove = null; }; });
let stageImg;
function fitRect(p) { const s = $('stage').getBoundingClientRect(); const k = Math.min((s.width - 48) / p.w, (s.height - 48) / p.h); return { left: (s.width - p.w * k) / 2, top: (s.height - p.h * k) / 2, width: p.w * k, height: p.h * k }; }
function placeImage(p, from) {
  const stage = $('stage'); const img = document.createElement('img'); img.alt = p.file;
  img.src = tiles.get(photos.indexOf(p))?.querySelector('img')?.currentSrc || photoUrl(p, 480);
  const full = new Image(); full.src = photoUrl(p, 1800); full.onload = () => { if (stageImg === img) img.src = full.src; };
  const t = fitRect(p); Object.assign(img.style, { left: '0px', top: '0px', width: `${t.width}px`, height: `${t.height}px` });

}

}
function syncViewer() {

$('vStrip').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; state.open = Number(b.dataset.i); select(state.open); syncViewer(); placeImage(photos[state.open]); });

}
$('cStrip').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { state.cull = Number(b.dataset.i); renderCull(); } });
$('kStars').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) mark({ rating: Number(b.dataset.n) }); });
$('kPick').onclick = () => mark({ flag: 'pick' }); $('kReject').onclick = () => mark({ flag: 'reject' });
$('cAuto').onclick = () => { state.auto = !state.auto; $('cAuto').setAttribute('aria-pressed', state.auto); };
$('cHide').onclick = () => $('pHide').onclick();
function current() { return state.view === 'cull' ? cullList()[state.cull] : state.open >= 0 ? photos[state.open] : photos[state.selected]; }
function mark(change) {
  const p = current(); if (!p) return; const before = { flag: p.flag, rating: p.rating }; Object.assign(p, change);
  const label = change.rating !== undefined ? (change.rating ? `评为 ${change.rating} 星` : '清除评级') : p.flag === 'pick' ? '留用' : p.flag === 'reject' ? '淘汰' : '清除旗标';
  showStatus(`${p.file} ${label}`, () => { Object.assign(p, before); renderAll(); });
  if (state.view === 'cull') { renderCull(); if (state.auto && change.flag && change.flag !== 'none') setTimeout(() => { if (state.cull < cullList().length - 1) { state.cull++; renderCull(); } }, 180); }
  else { const t = tiles.get(photos.indexOf(p)); if (t) { t.classList.toggle('reject', p.flag === 'reject'); t.querySelector('.badge').innerHTML = badgeHtml(p); t.querySelector('.stars').textContent = stars(p.rating); } }
}
let statusTimer;
function showStatus(text, undo) { const s = $('status'); s.innerHTML = `<span>${text}</span>${undo ? '<button id="undo">撤销</button>' : ''}`; s.classList.add('on'); clearTimeout(statusTimer); statusTimer = setTimeout(() => s.classList.remove('on'), 2600); if (undo) $('undo').onclick = () => { undo(); s.classList.remove('on'); }; }
function sheetFig(p) { return `<img alt="${p.file}" src="${photoUrl(p, 220)}">`; }
$('finish').onclick = () => {
  const all = filtered(); const picks = all.filter((p) => p.flag === 'pick'); const rejects = all.filter((p) => p.flag === 'reject');
  $('sheetTitle').textContent = `完成选片：${names[state.scope].at(-1)}`; $('sPickN').textContent = picks.length; $('sRejectN').textContent = rejects.length;
  $('sPick').innerHTML = picks.map(sheetFig).join(''); $('sReject').innerHTML = rejects.map(sheetFig).join('');
  $('trashNote').textContent = `共 ${rejects.reduce((n, p) => n + (p.paired ? 2 : 1), 0)} 个文件，${(rejects.length * 0.042).toFixed(2)} GB。`;
  $('sheet').classList.add('open'); $('sheetBack').focus();
};
$('sheetBack').onclick = () => $('sheet').classList.remove('open');
$('trash').onclick = () => { const n = filtered().filter((p) => p.flag === 'reject').length; $('sheet').classList.remove('open'); showStatus(`已把 ${n} 张淘汰照片移到废纸篓`, () => {}); };
function applyFilter(label, test) { state.filters = [{ label, test }]; setView('photos'); }
function vbars(data, opts) {
  const w = opts.width; const h = opts.height; const pad = { l: 36, b: 24, t: 6 }; const max = Math.max(...data.map((d) => d.v)) || 1;
  const step = (w - pad.l) / data.length; const bw = Math.max(4, Math.min(opts.max || 28, step - 6));
  const ticks = [0, Math.round(max / 2), max];
  let s = ticks.map((t) => { const y = pad.t + (1 - t / max) * (h - pad.t - pad.b); return `<line class="grid-line" x1="${pad.l}" x2="${w}" y1="${y}" y2="${y}"/><text class="axis" x="${pad.l - 8}" y="${y + 4}" text-anchor="end">${t}</text>`; }).join('');
  data.forEach((d, i) => { const x = pad.l + i * step + (step - bw) / 2; const bh = Math.max(d.v ? 2 : 0, (d.v / max) * (h - pad.t - pad.b)); const y = h - pad.b - bh; const r = Math.min(4, bw / 2, bh);
    s += `<rect class="hit" x="${pad.l + i * step}" y="${pad.t}" width="${step}" height="${h - pad.t - pad.b}" data-i="${i}"/><path class="bar-mark" d="M${x},${h - pad.b} V${y + r} q0,-${r} ${r},-${r} h${bw - 2 * r} q${r},0 ${r},${r} V${h - pad.b} Z"/>`;
    if (d.tick) s += `<text class="axis" x="${x + bw / 2}" y="${h - 6}" text-anchor="middle">${d.tick}</text>`; });
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${opts.label}">${s}</svg>`;
}
function wireBars(container, data, onPick) {
  const tip = $('tip'); const host = $('v-overview');
  container.querySelectorAll('.hit').forEach((hit) => {
    const d = data[Number(hit.dataset.i)];
    hit.addEventListener('pointermove', (e) => { const r = host.getBoundingClientRect(); tip.textContent = ''; const b = document.createElement('b'); b.textContent = `${d.v} 张`; tip.append(b, document.createTextNode(`  ${d.label}`)); tip.style.left = `${e.clientX - r.left}px`; tip.style.top = `${e.clientY - r.top + host.scrollTop}px`; tip.classList.add('on'); hit.nextElementSibling.classList.add('active'); });
    hit.addEventListener('pointerleave', () => { tip.classList.remove('on'); hit.nextElementSibling.classList.remove('active'); });
    hit.addEventListener('click', () => { tip.classList.remove('on'); onPick(d); });
  });
}
function renderOverview() {
  const all = filtered(); const ov = $('ov'); const width = ov.clientWidth || 900;
  const picks = all.filter((p) => p.flag === 'pick').length; const rejects = all.filter((p) => p.flag === 'reject').length;
  const rated = all.filter((p) => p.flag === 'none' && p.rating > 0).length; const unseen = all.length - picks - rejects - rated;
  const shot = [...new Set(scoped().map((p) => p.date))].sort();
  const timeline = [];
  for (let d = new Date(shot[0] + 'T00:00:00'); d <= new Date(shot.at(-1) + 'T00:00:00'); d.setDate(d.getDate() + 1)) {
    const date = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    timeline.push({ label: dayLabel(date), tick: d.getDate() === 1 || date === shot[0] ? `${d.getMonth() + 1}月${d.getDate() === 1 ? '' : d.getDate() + '日'}` : '', v: all.filter((p) => p.date === date).length, date });
  }
  const count = (key) => Object.entries(all.reduce((m, p) => { m[p[key]] = (m[p[key]] || 0) + 1; return m; }, {})).sort((a, b) => b[1] - a[1]);
  const cameras = count('camera'); const lenses = count('lens');
  const focalBins = [['24–35', 24, 35], ['36–50', 36, 50], ['51–70', 51, 70]].map(([label, lo, hi]) => ({ label: `${label} mm`, tick: label, v: all.filter((p) => p.focal >= lo && p.focal <= hi).length, lo, hi }));
  const isoBins = [64, 100, 200, 400, 800, 1600, 3200].map((n) => ({ label: `ISO ${n}`, tick: String(n), v: all.filter((p) => p.iso === n).length, iso: n }));
  const ranked = (rows, key) => { const max = rows[0]?.[1] || 1; return `<ul class="ranked">${rows.map(([name, n]) => `<li><button data-key="${key}" data-name="${name}"><span class="name">${name}</span><span class="meter"><span style="width:${(n / max) * 100}%"></span></span><span class="num">${n}</span></button></li>`).join('')}</ul>`; };
  const pct = (n) => `${(n / all.length) * 100}%`;
  ov.innerHTML = `<div class="figures"><div class="figure"><b>${all.length}</b><span>张照片</span></div><div class="figure"><b>${Math.round((picks / all.length) * 100)}%</b><span>留用率</span></div><div class="figure"><b>${(all.length * 0.042).toFixed(1)} GB</b><span>原片占用</span></div><div class="figure"><b>${unseen}</b><span>张还没处理</span></div></div>
  <section><div class="head"><h2>拍摄时间线</h2></div><p class="hint">每一天一根柱子。点有照片的一天，跳到那天的照片。</p><div class="timeline" id="tl">${vbars(timeline, { width: Math.max(320, width), height: 150, label: '每日拍摄数量', max: 40 })}</div></section>
  <section><div class="head"><h2>选片进度</h2><button class="act" id="goCull">继续选片</button></div><p class="hint">点一段，只看这部分照片。</p><div class="funnel" id="funnel"><button class="f-pick" style="width:${pct(picks)}" data-seg="pick" aria-label="留用 ${picks} 张"></button><button class="f-reject" style="width:${pct(rejects)}" data-seg="reject" aria-label="淘汰 ${rejects} 张"></button><button class="f-rated" style="width:${pct(rated)}" data-seg="rated" aria-label="已评星未打旗 ${rated} 张"></button><button class="f-unseen" style="width:${pct(unseen)}" data-seg="unseen" aria-label="未处理 ${unseen} 张"></button></div><div class="funnel-legend"><span><i class="key" style="background:var(--a-pick)"></i>留用 <b>${picks}</b></span><span><i class="key" style="background:var(--a-reject)"></i>淘汰 <b>${rejects}</b></span><span><i class="key" style="background:var(--a-series)"></i>评了星 <b>${rated}</b></span><span><i class="key" style="background:var(--a-raised)"></i>未处理 <b>${unseen}</b></span></div></section>
  <section class="two"><div><h2>相机</h2><p class="hint">点一行筛选照片。</p>${ranked(cameras, 'camera')}</div><div><h2>镜头</h2><p class="hint">按 EXIF 镜头型号。</p>${ranked(lenses, 'lens')}</div></section>
  <section class="two"><div class="mini"><h2>焦距</h2><p class="hint">按实际焦距分组。</p><div id="focal">${vbars(focalBins, { width: 420, height: 120, label: '焦距分布', max: 48 })}</div></div><div class="mini"><h2>ISO</h2><p class="hint">高 ISO 多在傍晚和室内。</p><div id="iso">${vbars(isoBins, { width: 420, height: 120, label: 'ISO 分布', max: 34 })}</div></div></section>`;
  wireBars($('tl'), timeline, (d) => d.v && applyFilter(d.label, (p) => p.date === d.date));
  wireBars($('focal'), focalBins, (d) => applyFilter(`焦距 ${d.label}`, (p) => p.focal >= d.lo && p.focal <= d.hi));
  wireBars($('iso'), isoBins, (d) => applyFilter(d.label, (p) => p.iso === d.iso));
  ov.querySelectorAll('.ranked button').forEach((b) => b.addEventListener('click', () => applyFilter(b.dataset.name, (p) => p[b.dataset.key] === b.dataset.name)));
  const segs = { pick: ['留用', (p) => p.flag === 'pick'], reject: ['淘汰', (p) => p.flag === 'reject'], rated: ['评了星', (p) => p.flag === 'none' && p.rating > 0], unseen: ['未处理', (p) => p.flag === 'none' && p.rating === 0] };
  $('funnel').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => applyFilter(segs[b.dataset.seg][0], segs[b.dataset.seg][1])));
  $('goCull').onclick = () => setView('cull');
}
function renderAll() { header(); if (state.view === 'photos') renderPhotos(); else if (state.view === 'cull') renderCull(); else renderOverview(); }
$('railLibs').onclick = () => $('app').classList.toggle('collapsed');
$('find').onclick = () => showStatus('命令面板与方向 A 相同');
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'b') { e.preventDefault(); $('app').classList.toggle('collapsed'); setTimeout(renderAll, 200); return; }
  if ((e.metaKey || e.ctrlKey) && ['1', '2', '3'].includes(e.key)) { e.preventDefault(); return setView(['photos', 'cull', 'overview'][Number(e.key) - 1]); }
  if ($('sheet').classList.contains('open')) { if (e.key === 'Escape') $('sheet').classList.remove('open'); return; }
  if (state.open >= 0) { if (e.key === 'Escape') closeViewer(); if (e.key === 'ArrowRight') stepViewer(1); if (e.key === 'ArrowLeft') stepViewer(-1); }
  else if (state.view === 'cull') { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); state.cull = Math.max(0, Math.min(cullList().length - 1, state.cull + (e.key === 'ArrowRight' ? 1 : -1))); return renderCull(); } }
  else if (state.view === 'photos') { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); return openViewer(state.selected); } if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); const list = filtered(); const n = list[list.indexOf(photos[state.selected]) + (e.key === 'ArrowRight' ? 1 : -1)]; if (n) select(photos.indexOf(n)); return; } }
  if (state.view === 'overview') return;
  const k = e.key.toLowerCase();
  if (/^[0-5]$/.test(e.key)) return mark({ rating: Number(e.key) });
  if (k === 'p') return mark({ flag: 'pick' }); if (k === 'x') return mark({ flag: 'reject' }); if (k === 'u') return mark({ flag: 'none' });
});
renderTree(); renderAll();
new ResizeObserver(() => { if (state.view === 'photos') renderPhotos(); }).observe($('scroll'));
const start = new URLSearchParams(location.search).get('view'); if (start) setView(start);
</script>
